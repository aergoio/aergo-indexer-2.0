# How to use
# copy this log file to the same directory as Aergo executable and rename to arglog.toml

level            = "info"              # default log level
formatter        = "console_no_color"  # format: console, console_no_color, json
caller           = true                # enabling source file and line printer
timefieldformat  = "Jan _2 15:04:05"

# indexer is main logger name
[indexer]
level = "debug"

# internalOp is logger of internal operations
#[internalOp]
#level = "info"

# event is a logger of events in transaction
#[event]
#level = "debug"

# indexer.es is a logger abount elasticsearch access
#[indexer.es]
#level = "debug"