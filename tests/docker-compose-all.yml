version: '3.2'
services:
    frontend:
        container_name: frontend_v2
        image: aergoscan/frontend:2.8.0
        ports:
            - '80:80'
        depends_on:
            - backend
    backend:
        container_name: aergoscan-api
        image: aergoscan/api:2.8.0
        ports:
            - '3000:3000'
        environment:
            AERGO_NODE: ${AERGO_NODE}
            HOST_API: ${SCAN_API_HOST}
            SELECTED_NETWORK: local
            ES_URL: es:9200
            HTTP_PORT: 3000
        depends_on:
            - db
        restart: always
    indexer:
        container_name: indexer
        image: aergo/indexer2:${INDEXER_VERSION}
        ports:
            - 8000:8000
        privileged: true
        command: indexer
            - --aergo=${AERGO_NODE}
            - --dburl=es:9200
            - --prefix=local
            - --mode=all
            - --from=${INDEX_FROM}
            - --to=${INDEX_TO}
            # - --contract=
            # - --token=
        depends_on:
            - db
        restart: always
    db:
        container_name: es
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.24
        environment:
            discovery.type: single-node
            xpack.security.enabled: false
            bootstrap.memory_lock: true
            ES_JAVA_OPTS: -Xms1024m -Xmx1024m
        ulimits:
            memlock:
                soft: -1
                hard: -1
        volumes:
            - type: bind
              source: ./data/eldata/data # custom
              target: /usr/share/elasticsearch/data
            - type: bind
              source: ./data/eldata/logs # custom
              target: /usr/share/elasticsearch/logs
        ports:
            - 9200:9200
            - 9300:9300
        privileged: true
        logging:
            driver: 'json-file'
            options:
                max-file: '7'
                max-size: '1000m'
    # Uncomment if you want to enable kibana
    # kibana:
