version: '3.2'
services:
    frontend:
        container_name: frontend_v2
        image: aergoscan/frontend:2.8.0
        ports:
            - '80:80'
        build:
            args:
                ARG_AERGO_NODE: ${AERGO_NODE}
                ARG_API_URL: ${SCAN_API_HOST}/v2
            dockerfile: Dockerfile.aergoscan
        depends_on:
            - backend
    backend:
        container_name: aergoscan-api
        image: aergoscan/api:2.8.0
        ports:
            - '3000:3000'
        build:
            context: ./aergoscan_v2_api
        environment:
            AERGO_NODE: ${AERGO_NODE}
            HOST_API: ${SCAN_API_HOST}
            SELECTED_NETWORK: local
            ES_URL: es:9200
            HTTP_PORT: 3000
        depends_on:
            - db
        restart: always
    db:
        container_name: es
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.24
        environment:
            discovery.type: single-node
            xpack.security.enabled: false
            bootstrap.memory_lock: true
            ES_JAVA_OPTS: -Xms1024m -Xmx1024m
        ulimits:
            memlock:
                soft: -1
                hard: -1
        volumes:
            - type: bind
              source: ./data/eldata/data # custom
              target: /usr/share/elasticsearch/data
            - type: bind
              source: ./data/eldata/logs # custom
              target: /usr/share/elasticsearch/logs
        ports:
            - 9200:9200
            - 9300:9300
        privileged: true
        logging:
            driver: 'json-file'
            options:
                max-file: '7'
                max-size: '1000m'
